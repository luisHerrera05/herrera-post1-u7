# application.properties
spring.application.name=multas-biblioteca-api

spring.datasource.url=jdbc:h2:mem:multas_biblioteca_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

server.port=8080

# --- Parte 2: pago en línea ---
# Cambiar a "wompi" activa WompiAdapter en su lugar; MultaService no se toca.
app.pagos.proveedor=pagosudes
app.pagos.pagosudes.url=http://localhost:9001/pagosudes/transacciones
app.pagos.wompi.url=http://localhost:9002/wompi/transactions
